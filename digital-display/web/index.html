<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Display · Dashboard</title>
<meta name="theme-color" content="#f97316">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --mute:#6b7280; --line:#e3e6eb; --accent:#2563eb; --ad:#d97706; --danger:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, "Noto Sans Devanagari", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; flex:1; }
  .status { font-size:13px; color:var(--mute); }
  button { font:inherit; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  main { display:grid; grid-template-columns: minmax(280px,1fr) minmax(320px,1.3fr); gap:16px; padding:16px; max-width:1400px; margin:auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; min-width:0; }
  section h2 { font-size:16px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  section h2 .count { color:var(--mute); font-weight:400; font-size:13px; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  input[type=text], input[type=search], input[type=number], input[type=date], input[type=time], select {
    font:inherit; border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:#fff; color:var(--ink); }
  input[type=search] { width:100%; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:10px; max-height:62vh; overflow:auto; }
  .tile { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fafafa; display:flex; flex-direction:column; }
  .thumb { aspect-ratio:16/9; background:#111; display:flex; align-items:center; justify-content:center; color:#fff; font-size:28px; overflow:hidden; }
  .thumb img, .thumb video { width:100%; height:100%; object-fit:cover; }
  .tile .name { font-size:12px; padding:6px 8px 0; word-break:break-all; line-height:1.3; max-height:3.9em; overflow:hidden; }
  .tile .acts { display:flex; gap:4px; padding:6px 8px 8px; margin-top:auto; }
  .tile .acts button { flex:1; padding:4px 6px; font-size:12px; }
  .tile { position:relative; }
  .tile.sel { outline:3px solid var(--accent); outline-offset:-1px; }
  .tile .pick { position:absolute; left:6px; top:6px; z-index:2; background:rgba(255,255,255,.92); border-radius:6px; padding:3px 4px; line-height:0; cursor:pointer; }
  .tile .pick input, .row .pick { width:18px; height:18px; cursor:pointer; margin:0; }
  .tile .inpl { position:absolute; right:6px; top:6px; z-index:2; font-size:11px; background:#16a34a; color:#fff; border-radius:99px; padding:1px 7px; }
  .bulk { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; margin:-2px 0 10px; font-size:13px; }
  .bulk label { display:flex; align-items:center; gap:6px; cursor:pointer; margin-right:auto; }
  .bulk label input { width:17px; height:17px; }
  .bulk button { padding:5px 10px; font-size:13px; }
  .row.sel { border-color:var(--accent); background:#eff6ff; }
  .list { display:flex; flex-direction:column; gap:6px; max-height:46vh; overflow:auto; }
  .row { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:10px; padding:6px; background:#fff; }
  .row.drag { opacity:.4; }
  .row .mini { width:72px; height:40px; border-radius:6px; overflow:hidden; background:#111; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; }
  .row .mini img, .row .mini video { width:100%; height:100%; object-fit:cover; }
  .row .label { flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .handle { cursor:grab; color:var(--mute); padding:0 4px; user-select:none; }
  .row input[type=number] { width:64px; }
  .row button { padding:4px 8px; font-size:12px; }
  .badge { font-size:11px; padding:1px 6px; border-radius:99px; background:#eef2ff; color:var(--accent); }
  .badge.ad { background:#fef3c7; color:var(--ad); }
  .empty { color:var(--mute); font-size:14px; padding:16px; text-align:center; border:1px dashed var(--line); border-radius:10px; }
  .settings { display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; font-size:14px; }
  .settings label { display:flex; align-items:center; gap:6px; }
  .settings input[type=number] { width:70px; }
  .settings [hidden] { display:none !important; }
  .adcard { border:1px solid var(--line); border-left:4px solid var(--ad); border-radius:10px; padding:10px; margin-bottom:10px; background:#fff; }
  .adcard .top { display:flex; gap:10px; align-items:center; }
  .adcard .fields { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px 14px; margin-top:10px; font-size:13px; }
  .adcard .fields label { display:flex; flex-direction:column; gap:3px; color:var(--mute); }
  .days { display:flex; gap:4px; flex-wrap:wrap; }
  .days label { flex-direction:row !important; align-items:center; gap:2px !important; color:var(--ink) !important; }
  .upload { border:2px dashed var(--line); border-radius:10px; padding:14px; text-align:center; color:var(--mute); margin-bottom:10px; }
  .upload.over { border-color:var(--accent); color:var(--accent); }
  .tvlink { font-size:13px; background:#f1f5f9; padding:8px 10px; border-radius:8px; margin-top:10px; word-break:break-all; }
  .full { grid-column: 1 / -1; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#111; color:#fff; padding:10px 16px; border-radius:8px; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.on { opacity:1; }
  .rx { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .rx fieldset { border:1px solid var(--line); border-radius:10px; padding:10px 12px 12px; margin:0; min-width:0; }
  .rx legend { font-weight:700; font-size:14px; padding:0 4px; }
  .rx label { display:flex; flex-direction:column; gap:3px; font-size:13px; color:var(--mute); margin-top:8px; }
  .rx label.chk { flex-direction:row; align-items:center; gap:6px; color:var(--ink); }
  .rx input[type=text], .rx textarea, .rx input[type=datetime-local], .rx select { width:100%; }
  .rx textarea { font:inherit; border:1px solid var(--line); border-radius:8px; padding:6px 8px; min-height:64px; resize:vertical; }
  .rx .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .logoBox { display:flex; align-items:center; gap:10px; margin-top:8px; }
  .logoBox .pv { width:120px; height:56px; border:1px dashed var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center; background:repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0/14px 14px; color:var(--mute); font-size:12px; overflow:hidden; }
  .logoBox .pv img { max-width:100%; max-height:100%; }
  .row input.cap { width:150px; }
  .hint { font-size:12px; color:var(--mute); margin-top:4px; }
  /* layout editor */
  .ly { display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:16px; align-items:start; }
  @media (max-width: 860px) { .ly { grid-template-columns:1fr; } }
  .lyWrap { display:flex; justify-content:center; background:#0b0b0f; border-radius:10px; padding:10px; }
  .lyStage { position:relative; overflow:hidden; background:#1f2430; border-radius:4px; touch-action:none; user-select:none; }
  .lyStage > img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:.85; pointer-events:none; }
  .lyStage .ovl .ow { pointer-events:auto; cursor:move; outline:3px dashed rgba(255,255,255,.35); outline-offset:6px; }
  .lyStage .ovl .ow.sel { outline:5px solid #3b82f6; z-index:5; }
  .lyStage .ovl .ow.is-off { opacity:.35; }
  .lyStage .ovl .ow-caption.off { opacity:1; transform:none; }
  .lyStage .ovl .ow-logo img:not([src]) { height:auto !important; min-height:60px; min-width:160px; color:#fff; font:700 40px system-ui; }
  .lyStage .lyH { position:absolute; right:-14px; bottom:-14px; width:28px; height:28px; background:#3b82f6; border:3px solid #fff; border-radius:50%; cursor:nwse-resize; display:none; }
  .lyStage .ow.sel .lyH { display:block; }
  .lyStage .ow-ticker .lyH { right:50%; bottom:-14px; cursor:ns-resize; }
  .lyStage .wPrev { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#fff;
                    background:#14141c; background:radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--accent) 45%, #111) 0%, #0b0b10 70%); line-height:1.1; z-index:6; }
  .lyStage .wPrev[hidden] { display:none; }
  .lyStage .wPrev .wk { font-size:.2em; letter-spacing:.35em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .lyStage .wPrev .wn { font-size:1em; font-weight:800; margin:.14em 0 .08em; }
  .lyStage .wPrev .wc { font-size:.26em; opacity:.9; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chips button { padding:5px 10px; font-size:13px; }
  .chips button.on { background:#3b82f6; border-color:#3b82f6; color:#fff; }
  .chips button.off { opacity:.55; }
  #lyFields label { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; margin-top:8px; color:var(--mute); }
  #lyFields input { width:96px; }
  .nudge { display:grid; grid-template-columns:repeat(3,38px); gap:4px; justify-content:center; margin-top:12px; }
  .nudge button { padding:4px 0; }
  /* ---------- Digital Display additions ---------- */
  header .brand { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  header .brand .lg { width:34px; height:34px; border-radius:9px; background:linear-gradient(145deg,#fb923c,#ea580c); display:flex; align-items:center; justify-content:center; flex:none; }
  header .brand .lg svg { width:20px; height:20px; }
  header .brand h1 { flex:none; }
  header .org { font-size:13px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width: 640px) { header { flex-wrap:wrap; } header .status { order:5; flex-basis:100%; } }
  .screens { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .scr { border:1px solid var(--line); border-radius:12px; padding:12px; background:#fff; display:flex; flex-direction:column; gap:8px; }
  .scr .top { display:flex; align-items:center; gap:8px; }
  .scr .dot { width:10px; height:10px; border-radius:50%; background:#d1d5db; flex:none; }
  .scr .dot.on { background:#16a34a; box-shadow:0 0 0 3px #dcfce7; }
  .scr input[type=text] { flex:1; min-width:0; font-weight:600; }
  .scr .meta { font-size:12px; color:var(--mute); }
  .scr select { width:100%; }
  .addtv { border:2px dashed var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; background:#fffaf5; }
  .addtv .code { font:700 22px/1 ui-monospace, monospace; letter-spacing:.2em; text-align:center; width:100%; }
  .addtv input[type=text] { width:100%; }
  .plbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:-2px 0 10px; font-size:13px; }
  .plbar select { flex:1; min-width:140px; }
  .folderRow { display:flex; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap; margin-top:8px; font-size:13px; }
  .folderRow input { width:200px; }
  /* login */
  #auth { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
          background:#0f1115; background:radial-gradient(110% 80% at 50% 0%, #6b3413 0%, #14161c 55%, #0b0c10 100%); }
  #auth[hidden], #app[hidden] { display:none !important; }
  .acard { width:100%; max-width:400px; background:#fff; border-radius:16px; padding:26px 24px 20px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  .acard .ab { display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; margin-bottom:14px; }
  .acard .ab .lg { width:56px; height:56px; border-radius:15px; background:linear-gradient(145deg,#fb923c,#ea580c); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 30px rgba(249,115,22,.35); }
  .acard .ab .lg svg { width:32px; height:32px; }
  .acard h2 { margin:4px 0 0; font-size:21px; }
  .acard .tag { color:var(--mute); font-size:13px; }
  .acard label { display:block; font-size:13px; color:var(--mute); margin:12px 0 5px; }
  .acard input { width:100%; font-size:16px !important; padding:10px 12px !important; border-radius:10px !important; }
  .acard .go { width:100%; margin-top:16px; padding:11px; font-weight:700; font-size:16px; border:0; border-radius:10px; background:#f97316; color:#fff; }
  .acard .arow { display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:13px; gap:8px; }
  .acard .link { background:none; border:0; padding:0; color:#c2410c; text-decoration:underline; font-size:13px; }
  .acard .err { color:var(--danger); font-size:13px; min-height:18px; margin-top:10px; text-align:center; }
  .acard .ok { color:#15803d; }
</style>
</head>
<body>
<div id="boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#14161c;color:#e4e4e7;font:16px/1.6 system-ui,sans-serif">
  <div>
    <div style="font-size:22px;font-weight:700;color:#fff">Digital Display</div>
    <div id="bootMsg" style="margin-top:8px">Loading…</div>
    <div style="margin-top:22px;font-size:14px;color:#a1a1aa">This is the control panel for phones and computers.<br>
      On a TV, open <b style="color:#fdba74">display.datpl.com/tv</b> or install the TV app.</div>
    <a href="tv/" style="display:inline-block;margin-top:16px;padding:10px 18px;border-radius:10px;background:#f97316;color:#fff;font-weight:700;text-decoration:none">Open the TV screen →</a>
  </div>
</div>
<script>
  // Plain old-style script: works even in browsers too old for the dashboard and explains instead of a blank page
  window.onerror = function () {
    var m = document.getElementById('bootMsg');
    if (m) m.innerHTML = 'This browser is too old for the control panel. Please use a phone or computer (Chrome, Edge, Safari).';
  };
</script>
<div id="auth" hidden>
  <form class="acard" id="authForm">
    <div class="ab"><div class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M10 8.5l4 2-4 2z" fill="#fff"/></svg></div><h2>Digital Display</h2><div class="tag" data-i18n="tagline"></div></div>
    <h3 id="aTitle" style="margin:6px 0 0;font-size:16px;text-align:center"></h3>
    <div id="aBizRow"><label for="aBiz" data-i18n="aBiz"></label><input type="text" id="aBiz" autocomplete="organization"></div>
    <div id="aEmailRow"><label for="aEmail" data-i18n="aEmail"></label><input type="email" id="aEmail" autocomplete="email" required></div>
    <div id="aPassRow"><label for="aPass" data-i18n="aPass"></label><input type="password" id="aPass" autocomplete="current-password" minlength="6"></div>
    <button class="go" id="aGo" type="submit"></button>
    <div class="err" id="aErr" role="alert"></div>
    <div class="arow">
      <button type="button" class="link" id="aSwitch"></button>
      <button type="button" class="link" id="aForgot" data-i18n="aForgot"></button>
    </div>
    <div class="arow" style="justify-content:center;gap:16px"><a class="link" href="tv/">Open TV screen</a><a class="link" href="DigitalDisplay.apk">Download TV app</a></div>
  </form>
</div>
<div id="app" hidden>
<header>
  <div class="brand"><div class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M10 8.5l4 2-4 2z" fill="#fff"/></svg></div><h1 data-i18n="title"></h1><span class="org" id="orgName"></span></div>
  <span class="status" id="status"></span>
  <button id="previewBtn" data-i18n="preview"></button>
  <button class="primary" id="saveBtn" disabled data-i18n="save"></button>
  <button id="logoutBtn" hidden data-i18n="logout"></button>
</header>

<main>
  <!-- SCREENS -->
  <section class="full">
    <h2><span data-i18n="screensTitle"></span> <span class="count" id="scrCount"></span>
      <a id="getApp" href="DigitalDisplay.apk" style="margin-left:auto;font-size:13px;font-weight:600;color:#c2410c" data-i18n="getApp"></a>
      <button id="refreshScr" data-i18n="refresh"></button></h2>
    <p class="status" style="margin-top:-4px" data-i18n="screensHelp"></p>
    <div class="screens" id="screens"></div>
  </section>

  <!-- LIBRARY -->
  <section>
    <h2><span data-i18n="library"></span> <span class="count" id="libCount"></span> <button id="refreshLib" style="margin-left:auto" data-i18n="refresh"></button></h2>
    <div class="upload" id="dropZone">
      <span data-i18n="dropHint"></span> <button id="pickBtn" data-i18n="pickFiles"></button>
      <input type="file" id="fileInput" multiple accept="video/*,image/*" hidden>
      <div class="folderRow"><span data-i18n="folderLbl"></span> <input type="text" id="upFolder" data-i18n-ph="folderPh"></div>
      <div class="hint" data-i18n="uploadHint"></div>
      <div id="upProgress"></div>
    </div>
    <input type="search" id="search" data-i18n-ph="searchPh">
    <div class="bulk">
      <label><input type="checkbox" id="libAll"> <span id="libSelTxt"></span></label>
      <button id="libAddSel" disabled></button>
      <button id="libAddAll"></button>
      <button class="danger" id="libRmSel" disabled></button>
    </div>
    <div class="grid" id="lib"></div>
  </section>

  <!-- PLAYLIST -->
  <section>
    <h2><span data-i18n="playlist"></span> <span class="count" id="plCount"></span>
      <button class="danger" id="clearPl" style="margin-left:auto" data-i18n="clearAll"></button></h2>
    <div class="plbar">
      <span data-i18n="plEditing"></span>
      <select id="plSel"></select>
      <button id="plNew" data-i18n="plNew"></button>
      <button id="plRename" data-i18n="plRename"></button>
      <button id="plDelete" class="danger" data-i18n="plDelete"></button>
    </div>
    <div class="bulk">
      <label><input type="checkbox" id="plAll"> <span id="plSelTxt"></span></label>
      <button class="danger" id="plRmSel" disabled></button>
    </div>
    <div class="list" id="playlist"></div>
    <div style="margin-top:14px" class="settings">
      <label><span data-i18n="photoSecs"></span> <input type="number" min="2" id="sImg"></label>
      <label><span data-i18n="adEvery1"></span> <input type="number" min="0" id="sEvery"> <span data-i18n="adEvery2"></span> <span class="status" data-i18n="adEveryOff"></span></label>
      <label><span data-i18n="fit"></span> <select id="sFit"><option value="contain" data-i18n="fitContain"></option><option value="cover" data-i18n="fitCover"></option></select></label>
      <label><input type="checkbox" id="sSound"> <span data-i18n="sound"></span></label>
      <label><input type="checkbox" id="sTrans"> <span data-i18n="fade"></span></label>
      <label><span data-i18n="screen"></span> <select id="sRot">
        <option value="0" data-i18n="rot0"></option>
        <option value="90" data-i18n="rot90"></option>
        <option value="270" data-i18n="rot270"></option>
        <option value="180" data-i18n="rot180"></option></select></label>
      <label><span data-i18n="scrSize"></span> <select id="sSize">
        <option value="16:9" data-i18n="sz169"></option>
        <option value="16:10">16:10 (1920×1200)</option>
        <option value="4:3">4:3 (1440×1080)</option>
        <option value="5:4">5:4 (1280×1024)</option>
        <option value="21:9" data-i18n="sz219"></option>
        <option value="32:9">32:9 (3840×1080)</option>
        <option value="custom" data-i18n="szCustom"></option></select></label>
      <label id="sCustomBox" hidden><input type="number" min="1" id="sCW" style="width:80px" placeholder="1920"> × <input type="number" min="1" id="sCH" style="width:80px" placeholder="1080"></label>
      <div class="status" style="flex-basis:100%" data-i18n="szHint"></div>
    </div>
    <div class="tvlink"><span data-i18n="tvLink"></span> <b id="tvUrl"></b></div>
  </section>

  <!-- RECEPTION -->
  <section class="full">
    <h2><span data-i18n="rxTitle"></span></h2>
    <p class="status" style="margin-top:-4px" data-i18n="rxHelp"></p>
    <div class="rx">
      <fieldset>
        <legend data-i18n="rxBrand"></legend>
        <div class="logoBox">
          <div class="pv" id="logoPv"></div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <button id="logoUp" data-i18n="logoUpload"></button>
            <button id="logoRm" class="danger" data-i18n="logoRemove"></button>
          </div>
          <input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/gif" hidden>
        </div>
        <div class="hint" data-i18n="logoHint"></div>

};
const lang = 'en';
const t = k => I18N[lang][k];

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  if (cfg) { renderAll(); setDirty(dirty); }
  if (typeof renderAuth === 'function') { renderAuth(); if (DB.orgId) { renderScreens(); renderPlSel(); } }
}

let cfg = null, lib = { media: [], ads: [] }, tab = 'media', dirty = false;

const uid = () => Math.random().toString(36).slice(2, 10);
const urlFor = it => DN.fileUrl(it.key || it.path);
const base = p => p.split('/').pop();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtSize = b => b > 1e9 ? (b/1e9).toFixed(1)+' GB' : b > 1e6 ? (b/1e6).toFixed(0)+' MB' : (b/1e3).toFixed(0)+' KB';

function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 2200); }
function setDirty(d = true) { dirty = d; $('#saveBtn').disabled = !d; $('#status').textContent = d ? t('unsaved') : t('allSaved'); }

// (the data layer — DB — is defined further down)

// Thumbnails: images load directly; videos show the first frame (metadata only, so it stays light)
function thumbHTML(it) {
  if (it.type === 'image') return `<img loading="lazy" src="${urlFor(it)}">`;
  return `<video preload="metadata" muted src="${urlFor(it)}#t=1"></video>`;
}

// ---------- library (with multi-select) ----------
const libSel = { media: new Set(), ads: new Set() };          // selected file paths per tab
const plKey = (src, p) => src + '|' + p;
const inPlaylist = () => new Set(cfg.playlist.map(it => plKey(it.source, it.path)));
let libItems = [];

function libFiltered() {
  const q = $('#search').value.trim().toLowerCase();
  return (lib[tab] || []).filter(f => !q || f.path.toLowerCase().includes(q));
}
function addToPlaylist(files) {
  const have = inPlaylist(); let added = 0, skip = 0;
  for (const f of files) {
    if (have.has(plKey(tab, f.path))) { skip++; continue; }
    cfg.playlist.push({ id: uid(), source: tab, path: f.path, key: f.key, type: f.type, duration: '' });
    have.add(plKey(tab, f.path)); added++;
  }
  if (added) setDirty();
  renderPlaylist(); renderLib(); toast(t('addedN')(added, skip));
}
function removeFromPlaylist(paths) {
  const kill = new Set([...paths].map(p => plKey(tab, p)));
  const before = cfg.playlist.length;
  cfg.playlist = cfg.playlist.filter(it => !kill.has(plKey(it.source, it.path)));
  const n = before - cfg.playlist.length;
  if (n) setDirty();
  renderPlaylist(); renderLib(); toast(t('removedN')(n));
}
function updateLibBulk() {
  const items = libItems, sel = libSel[tab];
  const nSel = items.filter(f => sel.has(f.path)).length;
  const have = inPlaylist();
  const nSelIn = items.filter(f => sel.has(f.path) && have.has(plKey(tab, f.path))).length;
  $('#libAll').checked = items.length > 0 && nSel === items.length;
  $('#libAll').indeterminate = nSel > 0 && nSel < items.length;
  $('#libSelTxt').textContent = nSel ? t('selN')(nSel, items.length) : t('selAll')(items.length);
  $('#libAddSel').textContent = t('addSel')(nSel); $('#libAddSel').disabled = !nSel;
  $('#libAddAll').textContent = t('addAll')(items.length); $('#libAddAll').disabled = !items.length;
  $('#libRmSel').textContent = t('rmSel')(nSelIn); $('#libRmSel').disabled = !nSelIn;
}

function renderLib() {
  const items = libItems = libFiltered();
  const sel = libSel[tab], have = inPlaylist();
  $('#libCount').textContent = `(${items.length})`;
  updateLibBulk();
  if (!items.length) {
    $('#lib').innerHTML = `<div class="empty" style="grid-column:1/-1">${t('noMedia')}</div>`;
    return;
  }
  // Render a capped number so big NAS folders don't freeze the page (bulk buttons still act on all matches)
  const LIMIT = 300;
  $('#lib').innerHTML = items.slice(0, LIMIT).map((f, i) => {
    const it = { source: tab, ...f }, on = sel.has(f.path), inpl = have.has(plKey(tab, f.path));
    return `<div class="tile${on ? ' sel' : ''}" data-i="${i}">
      <label class="pick" title="${t('selectItem')}"><input type="checkbox" data-pick="${i}" ${on ? 'checked' : ''}></label>
      ${inpl ? `<span class="inpl">${t('inPl')}</span>` : ''}
      <div class="thumb">${thumbHTML(it)}</div>
      <div class="name" title="${esc(f.path)}">${f.type === 'video' ? '🎬' : '🖼'} ${esc(f.path)}</div>
      <div class="status" style="font-size:11px;padding:0 8px">${fmtSize(f.size)}</div>
      <div class="acts">
        <button data-add="${i}">${t('addPl')}</button>
        <button data-mkad="${i}">${t('makeAd')}</button>
        <button class="danger" data-del="${i}" title="${t('delFile')}">🗑</button>
      </div></div>`;
  }).join('') + (items.length > LIMIT ? `<div class="empty" style="grid-column:1/-1">${t('moreFiles')(items.length - LIMIT)}</div>` : '');
}

$('#lib').addEventListener('change', e => {
  const i = e.target.dataset.pick; if (i === undefined) return;
  const f = libItems[+i], sel = libSel[tab];
  e.target.checked ? sel.add(f.path) : sel.delete(f.path);
  e.target.closest('.tile').classList.toggle('sel', e.target.checked);
  updateLibBulk();
});
$('#lib').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) {
    // clicking a picture toggles its selection
    const th = e.target.closest('.thumb'); if (!th) return;
    const cb = th.closest('.tile').querySelector('[data-pick]'); cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change', { bubbles: true })); return;
  }
  const f = libItems[b.dataset.add ?? b.dataset.mkad ?? b.dataset.del];
  if (b.dataset.add) { cfg.playlist.push({ id: uid(), source: tab, path: f.path, key: f.key, type: f.type, duration: '' }); renderPlaylist(); renderLib(); setDirty(); toast(t('addedPl')); }
  if (b.dataset.mkad) { cfg.ads.push({ id: uid(), source: tab, path: f.path, key: f.key, type: f.type, name: base(f.path), enabled: true, useInterval: true, duration: '', startDate: '', endDate: '', startTime: '', endTime: '', days: [], fixedTimes: [] }); renderAds(); setDirty(); toast(t('adMade')); }
  if (b.dataset.del && confirm(t('confirmDelFile')(f.path))) {
    if (dirty && !confirm(t('confirmLoseChanges'))) return;
    await DB.deleteMedia(f);
    libSel.media.delete(f.path);
    await loadAll(); toast(t('deleted'));
  }
});
$('#libAll').addEventListener('change', e => {
  const sel = libSel[tab];
  for (const f of libItems) e.target.checked ? sel.add(f.path) : sel.delete(f.path);
  renderLib();
});
$('#libAddSel').onclick = () => { const sel = libSel[tab]; addToPlaylist(libItems.filter(f => sel.has(f.path))); };
$('#libAddAll').onclick = () => {
  if (libItems.length > 1 && !confirm(t('confirmAddAll')(libItems.length))) return;
  addToPlaylist(libItems);
};
$('#libRmSel').onclick = () => {
  const have = inPlaylist(), sel = libSel[tab];
  const paths = libItems.filter(f => sel.has(f.path) && have.has(plKey(tab, f.path))).map(f => f.path);
  if (!paths.length || !confirm(t('confirmRmN')(paths.length))) return;
  removeFromPlaylist(paths);
};

const plSel = new Set();   // selected playlist item ids
function updatePlBulk() {
  const pl = cfg.playlist;
  for (const id of [...plSel]) if (!pl.some(it => it.id === id)) plSel.delete(id);
  const n = plSel.size;
  $('#plAll').checked = pl.length > 0 && n === pl.length;
  $('#plAll').indeterminate = n > 0 && n < pl.length;
  $('#plSelTxt').textContent = n ? t('selN')(n, pl.length) : t('selAll')(pl.length);
  $('#plRmSel').textContent = t('plRmSel')(n); $('#plRmSel').disabled = !n;
}
function renderPlaylist() {
  const pl = cfg.playlist;
  pl.forEach(it => { if (!it.id) it.id = uid(); });
  $('#plCount').textContent = `(${pl.length})`;
  updatePlBulk();
  if (cfg && tab && $('#lib').children.length) updateLibBulk();
  if (!pl.length) { $('#playlist').innerHTML = `<div class="empty">${t('plEmpty')}</div>`; return; }
  $('#playlist').innerHTML = pl.map((it, i) => `
    <div class="row${plSel.has(it.id) ? ' sel' : ''}" draggable="true" data-i="${i}">
      <input type="checkbox" class="pick" data-psel="${i}" ${plSel.has(it.id) ? 'checked' : ''} title="${t('selectItem')}">
      <span class="handle" title="${t('dragHint')}">⠿</span>
      <div class="mini">${thumbHTML(it)}</div>
      <div class="label" title="${esc(it.path)}">${i + 1}. ${esc(base(it.path))}
        <span class="badge ${it.source === 'ads' ? 'ad' : ''}">${it.type === 'video' ? t('video') : t('photo')}</span></div>
      <input type="text" class="cap" placeholder="${t('capPh')}" value="${esc(it.caption || '')}" data-cap="${i}">
      <input type="number" min="1" placeholder="${it.type === 'image' ? cfg.settings.imageDuration : t('full')}" value="${esc(it.duration || '')}" data-dur="${i}" title="${t('durTitle')}">
      <button data-up="${i}">↑</button><button data-down="${i}">↓</button>
      <button class="danger" data-rm="${i}">✕</button>
    </div>`).join('');
}

$('#playlist').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const pl = cfg.playlist, d = b.dataset;
  if (d.rm) pl.splice(+d.rm, 1);
  if (d.up && +d.up > 0) [pl[+d.up - 1], pl[+d.up]] = [pl[+d.up], pl[+d.up - 1]];
  if (d.down && +d.down < pl.length - 1) [pl[+d.down + 1], pl[+d.down]] = [pl[+d.down], pl[+d.down + 1]];
  renderPlaylist(); if (d.rm) renderLib(); setDirty();
});
$('#playlist').addEventListener('change', e => {
  const i = e.target.dataset.psel; if (i === undefined) return;

// ---------- Screen layout editor (uses the same overlay.js as the TV) ----------
const LY_FIELDS = {
  logo: [['x','fX'],['y','fY'],['h','fH']],
  clock: [['x','fX'],['y','fY'],['fs','fFs']],
  caption: [['x','fX'],['y','fY'],['fs','fFs']],
  qr: [['x','fX'],['y','fY'],['s','fS']],
  ticker: [['y','fY'],['h','fBarH'],['fs','fFs']],
  welcome: [['fs','fWfs']]
};
const LY_SIZE = { logo: 'h', clock: 'fs', caption: 'fs', qr: 's', ticker: 'h', welcome: 'fs' };
const LY_MIN = { x: 0, y: 0, h: 20, fs: 12, s: 60 };
const LY_LABEL = { logo: 'wLogo', clock: 'wClock', caption: 'wCaption', qr: 'wQr', ticker: 'wTicker', welcome: 'wWelcome' };
let ly = null, lySel = 'clock', lyDrag = null;

function lyOn(w) {
  const s = cfg.settings;
  return { logo: !!s.logo, clock: s.clock !== false, caption: s.captions !== false, qr: !!Overlay.qrTarget(s.qr),
           ticker: s.tickerOn !== false && !!(s.ticker || '').trim(), welcome: !!(s.welcome || {}).enabled }[w];
}
function lyGet() { return Overlay.layoutFor(cfg.settings); }
function lySet(w, k, v) {
  const s = cfg.settings, L = lyGet(), o = L.key;
  const max = { x: L.W - 20, y: L.H - 20 }[k];
  v = Math.round(Math.max(LY_MIN[k] ?? 0, max ? Math.min(max, v) : v));
  s.layout = { ...(s.layout || {}) };
  s.layout[o] = { ...(s.layout[o] || {}) };
  s.layout[o][w] = { ...(s.layout[o][w] || {}), [k]: v };
  setDirty();
}

// Keep a widget fully on screen (measured in design px, so it works for any size)
function lyKeepInside(w) {
  if (!ly || w === 'welcome') return false;
  const el = ly[w], L = lyGet(), p = L[w];
  if (!el || el.hidden) return false;
  const bw = w === 'ticker' ? 0 : el.offsetWidth, bh = el.offsetHeight;
  const nx = Math.max(0, Math.min(p.x ?? 0, L.W - bw)), ny = Math.max(0, Math.min(p.y, L.H - bh));
  let changed = false;
  if (w !== 'ticker' && Math.round(nx) !== p.x) { lySet(w, 'x', nx); changed = true; }
  if (Math.round(ny) !== p.y) { lySet(w, 'y', ny); changed = true; }
  return changed;
}
function lyRefresh(w) { renderLayout(); if (lyKeepInside(w)) renderLayout(); }

function renderLayout() {
  if (!cfg) return;
  const stage = $('#lyStage');
  if (!ly) {
    ly = Overlay.mount(stage);
    // resize handles
    ly.root.querySelectorAll('.ow').forEach(el => { const h = document.createElement('div'); h.className = 'lyH'; el.appendChild(h); });
    const wp = document.createElement('div'); wp.className = 'wPrev'; wp.hidden = true; stage.appendChild(wp);
    ly.wPrev = wp;
    stage.addEventListener('pointerdown', lyDown);
    window.addEventListener('pointermove', lyMove);
    window.addEventListener('pointerup', () => { lyDrag = null; });
    window.addEventListener('resize', () => renderLayout());
  }
  const L = lyGet();
  // stage size: same shape as the TV, as big as fits
  const wrapW = $('#lyWrap').clientWidth - 20, maxH = Math.max(320, window.innerHeight * 0.7);
  let w = wrapW, h = w * L.H / L.W;
  if (h > maxH) { h = maxH; w = h * L.W / L.H; }
  stage.style.width = Math.round(w) + 'px'; stage.style.height = Math.round(h) + 'px';
  $('#lyOrient').textContent = (L.o === 'portrait' ? t('lyPortrait') : t('lyLandscape')).split('·')[0] + '· ' + L.W + '×' + L.H;

  // background: first photo in the playlist
  const first = cfg.playlist.find(it => it.type === 'image');
  const bg = $('#lyBg');
  if (first) { const u = urlFor(first); if (bg.getAttribute('src') !== u) bg.src = u; bg.hidden = false; bg.style.objectFit = cfg.settings.fit || 'contain'; }
  else bg.hidden = true;

  Overlay.apply(ly, cfg.settings, { brandUrl, showAll: true });
  Overlay.setCaption(ly, t('sampleCaption'), cfg.settings.captionLabel || '', true);
  ly.root.querySelectorAll('.ow').forEach(el => el.classList.toggle('sel', el.dataset.w === lySel));

  // welcome preview
  const s = cfg.settings, wv = s.welcome || {};
  ly.wPrev.hidden = lySel !== 'welcome';
  ly.wPrev.style.fontSize = (L.welcome.fs * ly.k) + 'px';
  ly.wPrev.innerHTML = `<div class="wk">${esc(wv.title || 'Welcome')}</div><div class="wn">${esc(wv.name || t('sampleGuest'))}</div>${wv.company ? `<div class="wc">${esc(wv.company)}</div>` : ''}`;

  // chips
  $('#lyChips').innerHTML = Overlay.WIDGETS.map(wd =>
    `<button data-w="${wd}" class="${wd === lySel ? 'on' : ''} ${lyOn(wd) ? '' : 'off'}">${t(LY_LABEL[wd])}${lyOn(wd) ? '' : ' ' + t('lyOff')}</button>`).join('');
  // fields for the selected item
  const cur = L[lySel];
  $('#lyFields').innerHTML = LY_FIELDS[lySel].map(([k, lab]) =>
    `<label>${t(lab)} <input type="number" step="1" data-k="${k}" value="${cur[k]}"> </label>`).join('');
  $('#lyNudge').style.visibility = lySel === 'welcome' ? 'hidden' : '';
}

function lyDown(e) {
  const handle = e.target.closest('.lyH'), el = e.target.closest('.ow');
  if (!el) return;
  e.preventDefault();
  lySel = el.dataset.w;
  const L = lyGet(), p = L[lySel];
  lyDrag = { w: lySel, resize: !!handle, sx: e.clientX, sy: e.clientY, x: p.x, y: p.y, size: p[LY_SIZE[lySel]], fs: p.fs };
  renderLayout();
}
function lyMove(e) {
  if (!lyDrag || !ly) return;
  const dx = (e.clientX - lyDrag.sx) / ly.k, dy = (e.clientY - lyDrag.sy) / ly.k, w = lyDrag.w;
  if (lyDrag.resize) {
    const key = LY_SIZE[w];
    const factor = key === 'fs' ? 0.8 : 1;
    lySet(w, key, lyDrag.size + dy * factor);
    if (w === 'ticker' && lyDrag.fs) lySet(w, 'fs', lyDrag.fs + dy * 0.6);
  } else {
    if (w !== 'ticker') lySet(w, 'x', lyDrag.x + dx);
    lySet(w, 'y', lyDrag.y + dy);
  }
  lyRefresh(w);
}
$('#lyChips').addEventListener('click', e => { const b = e.target.closest('button[data-w]'); if (b) { lySel = b.dataset.w; renderLayout(); } });
$('#lyFields').addEventListener('input', e => {
  const k = e.target.dataset.k; if (!k || e.target.value === '') return;
  lySet(lySel, k, +e.target.value);
  const keep = document.activeElement === e.target ? k : null;
  lyRefresh(lySel);
  if (keep) { const inp = $(`#lyFields input[data-k="${keep}"]`); inp.focus(); }
});
function lyNudge(dx, dy) {
  if (lySel === 'welcome') return;
  const p = lyGet()[lySel];
  if (dx && lySel !== 'ticker') lySet(lySel, 'x', p.x + dx);
  if (dy) lySet(lySel, 'y', p.y + dy);
  lyRefresh(lySel);
}
$('#lyNudge').addEventListener('click', e => { const b = e.target.closest('button'); if (b) lyNudge(+b.dataset.dx, +b.dataset.dy); });
document.addEventListener('keydown', e => {
  if (!ly || !/^Arrow/.test(e.key) || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const r = $('#lyStage').getBoundingClientRect();
  if (r.bottom < 0 || r.top > window.innerHeight) return;   // only while the editor is on screen
  e.preventDefault();
  const st = e.shiftKey ? 10 : 1;
  lyNudge(e.key === 'ArrowLeft' ? -st : e.key === 'ArrowRight' ? st : 0, e.key === 'ArrowUp' ? -st : e.key === 'ArrowDown' ? st : 0);
});
$('#lyReset').onclick = () => {
  if (!confirm(t('lyConfirmReset'))) return;
  const o = lyGet().key, s = cfg.settings;
  s.layout = { ...(s.layout || {}) }; delete s.layout[o];
  setDirty(); renderLayout();
};

// ======================================================================
// Digital Display — cloud data layer (Supabase), login, screens, playlists
// ======================================================================
const sb = supabase.createClient(DN.supabaseUrl, DN.supabaseKey, { auth: { persistSession: true, detectSessionInUrl: true } });
// Where people (and e-mail links) should land: the public datpl.com address once the site runs there
const HERE = location.origin + location.pathname.replace(/index\.html$/, '');
const DASH_URL = HERE;                       // e-mail links come back to the address in use
const MAX_MB = 50;

const DB = {
  orgId: null, orgName: '', playlistId: null, playlists: [], screens: [],
  async boot(bizName) {
    const { data, error } = await sb.rpc('dn_bootstrap', { p_name: bizName || null });
    if (error) throw error;
    this.orgId = data.org_id;
    const o = await sb.from('dn_orgs').select('name').eq('id', this.orgId).single();
    this.orgName = (o.data && o.data.name) || '';
    await this.loadPlaylists();
    let last = null; try { last = localStorage.getItem('dn_pl_' + this.orgId); } catch {}
    this.playlistId = this.playlists.some(p => p.id === last) ? last : (this.playlists[0] || {}).id;
  },
  async loadPlaylists() {
    const { data, error } = await sb.from('dn_playlists').select('id,name,version,updated_at').eq('org_id', this.orgId).order('created_at');
    if (error) throw error;
    this.playlists = data;
  },
  async loadConfig() {
    const { data, error } = await sb.from('dn_playlists').select('config').eq('id', this.playlistId).single();
    if (error) throw error;
    const c = data.config || {};
    return { settings: { ...DEFAULT_SETTINGS, ...(c.settings || {}) }, playlist: c.playlist || [], ads: c.ads || [] };
  },
  async saveConfig(c) {
    const clean = { settings: c.settings, playlist: c.playlist, ads: c.ads };
    const { data, error } = await sb.from('dn_playlists').update({ config: clean }).eq('id', this.playlistId).select('config').single();
    if (error) throw error;
    return { settings: { ...DEFAULT_SETTINGS, ...(data.config.settings || {}) }, playlist: data.config.playlist || [], ads: data.config.ads || [] };
  },
  async library() {
    const { data, error } = await sb.from('dn_media').select('id,key,name,type,size,created_at').eq('org_id', this.orgId).order('name');
    if (error) throw error;
    return { media: data.map(m => ({ id: m.id, key: m.key, path: m.name, type: m.type, size: m.size })), ads: [] };
  },
  async token() { const { data } = await sb.auth.getSession(); return data.session && data.session.access_token; },
  // XHR so we can show upload progress
  async putObject(key, file, onProgress) {
    const tok = await this.token();
    await new Promise((resolve, reject) => {
      const x = new XMLHttpRequest();
      x.open('POST', `${DN.supabaseUrl}/storage/v1/object/${DN.bucket}/${key.split('/').map(encodeURIComponent).join('/')}`);
      x.setRequestHeader('Authorization', 'Bearer ' + tok);
      x.setRequestHeader('apikey', DN.supabaseKey);
      x.setRequestHeader('x-upsert', 'false');
      x.setRequestHeader('cache-control', 'max-age=31536000');
      x.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
      x.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded / e.total * 100)); };
      x.onload = () => x.status >= 200 && x.status < 300 ? resolve() : reject(new Error(t('upErr') + ' (' + x.status + ')'));
      x.onerror = () => reject(new Error(t('upErr')));
      x.send(file);
    });
  },
  newKey(file, sub) {
    const ext = ((file.name.match(/\.([a-z0-9]{1,5})$/i) || [])[1] || '').toLowerCase();
    return `${this.orgId}/${sub ? sub + '/' : ''}${crypto.randomUUID()}${ext ? '.' + ext : ''}`;
  },
  async upload(file, folder, onProgress) {
    const type = /^video\//.test(file.type) ? 'video' : /^image\//.test(file.type) ? 'image' : null;
    if (!type) throw new Error(t('notMedia')(file.name));
    if (file.size > MAX_MB * 1048576) throw new Error(t('tooBig')(file.name, MAX_MB));
    // display name ("folder/file.jpg") — the folder becomes the caption on the TV; keep it unique
    const have = new Set(lib.media.map(m => m.path));
    let name = (folder ? folder + '/' : '') + file.name, n = 2;
    while (have.has(name)) name = (folder ? folder + '/' : '') + file.name.replace(/(\.[^.]+)?$/, ` (${n++})$1`);
    const key = this.newKey(file);
    await this.putObject(key, file, onProgress);
    const { error } = await sb.from('dn_media').insert({ org_id: this.orgId, key, name, type, size: file.size });
    if (error) { await sb.storage.from(DN.bucket).remove([key]); throw error; }
    lib.media.push({ key, path: name, type, size: file.size });
  },
  async uploadLogo(file) {
    if (!/^image\//.test(file.type) || file.size > 20 * 1048576) throw new Error('logo');
    const key = this.newKey(file, 'brand');
    await this.putObject(key, file);
    return key;
  },
  async deleteMedia(f) {
    await sb.storage.from(DN.bucket).remove([f.key]);
    const { error } = await sb.from('dn_media').delete().eq('key', f.key);
    if (error) throw error;
  },
  async screensList() {
    const { data, error } = await sb.from('dn_screens').select('id,name,playlist_id,last_seen,paired_at,info').eq('org_id', this.orgId).order('paired_at');
    if (error) throw error;
    this.screens = data;
    return data;
  },
  async claim(code, name) {
    const { error } = await sb.rpc('dn_claim_screen', { p_code: code, p_name: name, p_org: this.orgId });
    if (error) throw error;
  },
  async updateScreen(id, patch) { const { error } = await sb.from('dn_screens').update(patch).eq('id', id); if (error) throw error; },
  async removeScreen(id) { const { error } = await sb.from('dn_screens').delete().eq('id', id); if (error) throw error; },
  async newPlaylist(name) {
    const { data, error } = await sb.from('dn_playlists').insert({ org_id: this.orgId, name, config: { settings: {}, playlist: [], ads: [] } }).select('id').single();
    if (error) throw error;
    await this.loadPlaylists(); return data.id;
  },
  async renamePlaylist(id, name) { const { error } = await sb.from('dn_playlists').update({ name }).eq('id', id); if (error) throw error; await this.loadPlaylists(); },
  async deletePlaylist(id) { const { error } = await sb.from('dn_playlists').delete().eq('id', id); if (error) throw error; await this.loadPlaylists(); }
};

const DEFAULT_SETTINGS = {
  imageDuration: 10, adEveryN: 3, fit: 'contain', sound: false, transition: true, rotation: 0,
  accent: '#f97316', captions: true, captionLabel: '', clock: true, logo: '', qr: '', qrLabel: '',
  ticker: '', tickerOn: true, tickerSpeed: 1,
  welcome: { enabled: false, title: '', name: '', company: '', message: '', until: '', everyN: 4, seconds: 10 }
};

// ---------- screens (TVs) ----------
let LATEST_APP = null;   // newest TV app version on this website (version.json, written by the build)
const verCmp = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); return 0; };
fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null)
  .then(v => { if (v && v.versionName) { LATEST_APP = v.versionName; const a = $('#getApp'); if (a) a.textContent = t('getApp') + ' ' + v.versionName; if (DB.orgId) renderScreens(); } })
  .catch(() => {});
const params = new URLSearchParams(location.search);
let pendingCode = (params.get('code') || '').replace(/\D/g, '').slice(0, 6);
function ago(ts) {
  if (!ts) return t('neverSeen');
  const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
  return s < 90 ? t('online') : t('offlineFor')(s < 3600 ? Math.round(s / 60) + ' min' : s < 86400 ? Math.round(s / 3600) + ' h' : Math.round(s / 86400) + ' d');
}
function renderScreens() {
  const list = DB.screens;
  $('#scrCount').textContent = `(${list.length})`;
  const plOpts = sel => DB.playlists.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  $('#screens').innerHTML = list.map((sc, i) => {
    const on = sc.last_seen && Date.now() - new Date(sc.last_seen).getTime() < 90000;
    const inf = sc.info || {};
    const model = inf.app ? 'App ' + esc(inf.app) : inf.ua ? (/Android/.test(inf.ua) ? 'Android TV browser' : 'Browser') : '';
    const vNote = !inf.app || !LATEST_APP ? '' : verCmp(inf.app, LATEST_APP) < 0
      ? `<div class="meta" style="color:#c2410c;font-weight:600">${t('updAvail')(LATEST_APP)}</div>`
      : `<div class="meta" style="color:#15803d">${t('updLatest')}</div>`;
    return `<div class="scr" data-i="${i}">
      <div class="top"><span class="dot ${on ? 'on' : ''}"></span><input type="text" value="${esc(sc.name)}" data-scrname="${i}" title="${t('scrRenameHint')}"></div>
      <div class="meta">${ago(sc.last_seen)}${model ? ' · ' + model : ''}${inf.w ? ` · ${inf.w}×${inf.h}` : ''}</div>${vNote}
      <label class="meta">${t('scrPlaylist')}<select data-scrpl="${i}">${plOpts(sc.playlist_id)}</select></label>
      <div style="text-align:right"><button class="danger" data-scrrm="${i}">${t('scrRemove')}</button></div>
    </div>`;
  }).join('') + `<form class="addtv" id="addTv">
      <b>${t('addTvTitle')}</b>
      <div class="meta">${t('addTvHelp')}</div>
      <input class="code" id="atCode" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="000 000" value="${esc(pendingCode)}" required>
      <input type="text" id="atName" placeholder="${t('addTvName')}" maxlength="60">
      <button class="primary" type="submit">${t('addTvBtn')}</button>
    </form>`;
}
$('#screens').addEventListener('change', async e => {
  const d = e.target.dataset;
  if (d.scrname === undefined && d.scrpl === undefined) return;   // typing in the "Add TV" form
  try {
    if (d.scrname !== undefined) { const v = e.target.value.trim(); if (v) { await DB.updateScreen(DB.screens[+d.scrname].id, { name: v }); toast(t('saved')); } }
    if (d.scrpl !== undefined) { await DB.updateScreen(DB.screens[+d.scrpl].id, { playlist_id: e.target.value }); toast(t('savedToast')); }
    await refreshScreens();
  } catch (err) { alert(err.message); }
});
$('#screens').addEventListener('click', async e => {
  const i = e.target.dataset.scrrm; if (i === undefined) return;
  const sc = DB.screens[+i];
  if (!confirm(t('confirmScrRemove')(sc.name))) return;
  try { await DB.removeScreen(sc.id); await refreshScreens(); } catch (err) { alert(err.message); }
});
$('#screens').addEventListener('submit', async e => {
  e.preventDefault();
  const code = $('#atCode').value.replace(/\D/g, '');
  const name = $('#atName').value.trim() || ('TV ' + (DB.screens.length + 1));
  if (code.length !== 6) { alert(t('addTvBad')); return; }
  try {
    await DB.claim(code, name);
    pendingCode = '';
    if (params.has('code')) history.replaceState(null, '', location.pathname);
    await refreshScreens(); toast(t('addTvOk'));
  } catch (err) { alert(/expired|not found/i.test(err.message) ? t('addTvBad') : err.message); }
});
async function refreshScreens() { await DB.screensList(); renderScreens(); }
$('#refreshScr').onclick = () => refreshScreens().catch(e => alert(e.message));

// ---------- playlists ----------
function renderPlSel() {
  $('#plSel').innerHTML = DB.playlists.map(p => `<option value="${p.id}" ${p.id === DB.playlistId ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  $('#plDelete').disabled = DB.playlists.length < 2;
}
async function switchPlaylist(id) {
  DB.playlistId = id;
  try { localStorage.setItem('dn_pl_' + DB.orgId, id); } catch {}
  cfg = await DB.loadConfig();
  plSel.clear(); renderAll(); renderPlSel(); setDirty(false);
}
$('#plSel').onchange = async e => {
  if (dirty && !confirm(t('confirmLoseChanges'))) { e.target.value = DB.playlistId; return; }
  await switchPlaylist(e.target.value);
};
$('#plNew').onclick = async () => {
  const name = (prompt(t('plNewName'), '') || '').trim(); if (!name) return;
  if (dirty && !confirm(t('confirmLoseChanges'))) return;
  try { const id = await DB.newPlaylist(name); await switchPlaylist(id); renderScreens(); } catch (e) { alert(e.message); }
};
$('#plRename').onclick = async () => {
  const cur = DB.playlists.find(p => p.id === DB.playlistId);
  const name = (prompt(t('plRename'), cur ? cur.name : '') || '').trim(); if (!name) return;
  try { await DB.renamePlaylist(DB.playlistId, name); renderPlSel(); renderScreens(); } catch (e) { alert(e.message); }
};
$('#plDelete').onclick = async () => {
  if (DB.playlists.length < 2) return;
  const cur = DB.playlists.find(p => p.id === DB.playlistId);
  if (!confirm(t('confirmPlDelete')(cur.name))) return;
  try {
    await DB.deletePlaylist(DB.playlistId);
    await switchPlaylist(DB.playlists[0].id); await refreshScreens();
  } catch (e) { alert(e.message); }
};

// ---------- login / sign up / reset ----------
let authMode = 'login';   // login | signup | forgot | newpass
function renderAuth() {
  const m = authMode;
  $('#aTitle').textContent = t({ login: 'aLoginT', signup: 'aSignupT', forgot: 'aForgotT', newpass: 'aNewPassT' }[m]);
  $('#aBizRow').hidden = m !== 'signup';
  $('#aEmailRow').hidden = m === 'newpass';
  $('#aPassRow').hidden = m === 'forgot';
  $('#aEmail').required = m !== 'newpass';
  $('#aPass').required = m !== 'forgot';
  $('#aPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('#aGo').textContent = t({ login: 'aLogin', signup: 'aSignup', forgot: 'aSendReset', newpass: 'aSetPass' }[m]);
  $('#aSwitch').textContent = m === 'login' ? t('aToSignup') : t('aToLogin');
  $('#aForgot').hidden = m !== 'login';
}
function hideBoot() { const b = document.getElementById('boot'); if (b) b.remove(); }
function showAuth(mode) { hideBoot(); authMode = mode || authMode; $('#auth').hidden = false; $('#app').hidden = true; $('#aErr').textContent = ''; renderAuth(); }
$('#aSwitch').onclick = () => showAuth(authMode === 'login' ? 'signup' : 'login');
$('#aForgot').onclick = () => showAuth('forgot');
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('#aErr'), go = $('#aGo'), email = $('#aEmail').value.trim(), pass = $('#aPass').value;
  err.className = 'err'; err.textContent = ''; go.disabled = true;
  try {
    if (authMode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
    } else if (authMode === 'signup') {
      const biz = $('#aBiz').value.trim();
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { business: biz }, emailRedirectTo: DASH_URL } });
      if (error) throw error;
      if (!data.session) { err.className = 'err ok'; err.textContent = t('aCheckEmail'); }
    } else if (authMode === 'forgot') {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: DASH_URL });
      if (error) throw error;
      err.className = 'err ok'; err.textContent = t('aResetSent');
    } else if (authMode === 'newpass') {
      const { error } = await sb.auth.updateUser({ password: pass });
      if (error) throw error;
      toast(t('aPassChanged')); authMode = 'login'; await enterApp();
    }
  } catch (ex) {
    err.textContent = /invalid login/i.test(ex.message || '') ? t('aWrong') : (ex.message || String(ex));
  }
  go.disabled = false;
});

let entered = false;
async function enterApp() {
  if (entered) return; entered = true;
  try {
    const { data } = await sb.auth.getUser();
    const biz = data.user && data.user.user_metadata && data.user.user_metadata.business;
    await DB.boot(biz);
    $('#orgName').textContent = DB.orgName + (data.user ? ' · ' + data.user.email : '');
    hideBoot(); $('#auth').hidden = true; $('#app').hidden = false;
    $('#tvUrl').textContent = (DN.publicUrl || DASH_URL).replace(/^https?:\/\//, '') + 'tv/';
    renderPlSel();
    await Promise.all([loadAll(), refreshScreens()]);
    if (pendingCode) setTimeout(() => { const c = $('#atCode'); if (c) { c.scrollIntoView({ block: 'center' }); $('#atName').focus(); } }, 300);
    setInterval(() => { if (!document.hidden) refreshScreens().catch(() => {}); }, 30000);
  } catch (e) {
    entered = false;
    showAuth('login'); $('#aErr').textContent = t('connFail') + (e.message || e);
  }
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') { showAuth('newpass'); return; }
  if (session && authMode !== 'newpass') setTimeout(enterApp, 0);
});
applyLang();
sb.auth.getSession().then(({ data }) => { if (data.session) { if (authMode !== 'newpass') enterApp(); } else showAuth('login'); })
  .catch(() => showAuth('login'));

</script>
